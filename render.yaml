services:
  - type: web
    name: aryan-portfolio-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: Aryan Enterprise Portfolio API
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEYS
        sync: false
      - key: IP_HASH_PEPPER
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_DOMAIN
        value: ""
      - key: ADMIN_EMAIL
        value: aryantembhekar294@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Aryan Tembhekar
      - key: MAIL_SEND_CONFIRMATION
        value: "false"
      - key: CONTACT_RATE_LIMIT
        value: "5"
      - key: CONTACT_RATE_WINDOW_SECONDS
        value: "3600"
